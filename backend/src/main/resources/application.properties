spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/paycore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development - disabled in prod)
spring.h2.console.enabled=false

# Payment Link Configuration
payment.link.base-url=${PAYMENT_LINK_BASE_URL:}

# Server Configuration
server.port=8081
server.forward-headers-strategy=native
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# Logging
logging.level.com.upi.gateway.backend=INFO
logging.level.org.springframework.web=INFO

# Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Webhook Configuration
webhook.timeout.ms=10000
webhook.retry.max=3
webhook.retry.delay.ms=1000

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100